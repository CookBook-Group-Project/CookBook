name: Build and Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  WEB_IMAGE: ghcr.io/psoteropulos/cookbook-web
  SERVER_IMAGE: ghcr.io/psoteropulos/cookbook-server

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.event.pull_request.merge_commit_sha }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.event.pull_request.merge_commit_sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Sync repo, pull latest images, and restart
        run: |
          cd ~/apps/cookbook
          git pull
          docker compose pull
          docker compose up -d
