services:
  web:
    image: ghcr.io/psoteropulos/cookbook-web:latest
    build: ./client
    container_name: cookbook-web
    restart: unless-stopped
    networks: [edge, internal]

  server:
    image: ghcr.io/psoteropulos/cookbook-server:latest
    build: ./server
    container_name: cookbook-server
    restart: unless-stopped
    env_file: .env
    networks: [internal]

  mongo:
    image: mongo:7
    container_name: cookbook-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks: [internal]

networks:
  edge:
    external: true
  internal:

volumes:
  mongo-data:
